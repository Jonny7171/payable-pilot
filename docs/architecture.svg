<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PayablePilot architecture</title>
  <desc id="desc">A Strands agent processes invoice packets with deterministic tools, clears clean packets, and sends exceptions to a human decision gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8f7fc"/><stop offset="1" stop-color="#eeeaff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#251b5e" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c86a4"/></marker>
    <style>.label{font:700 18px Inter,Arial,sans-serif;fill:#1c1a2c}.small{font:500 14px Inter,Arial,sans-serif;fill:#6d697d}.eyebrow{font:800 12px Inter,Arial,sans-serif;fill:#5d43e6;letter-spacing:1.6px}.tool{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#513cc2}.line{fill:none;stroke:#8c86a4;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <text x="70" y="70" class="eyebrow">PAYABLEPILOT</text>
  <text x="70" y="108" class="label" style="font-size:30px">Agentic orchestration. Deterministic money. Human authority.</text>
  <path class="line" d="M245 250H355"/><path class="line" d="M600 250H710"/><path class="line" d="M865 218V168H1000V205"/><path class="line" d="M865 282V400H1000V362"/><path class="line" d="M1000 438V500H680"/>
  <g filter="url(#shadow)">
    <rect x="60" y="180" width="185" height="140" rx="22" fill="#fff" stroke="#e1deeb"/>
    <circle cx="104" cy="223" r="19" fill="#eeeaff"/><path d="M94 215h20v18H94zM98 211h12" fill="none" stroke="#5d43e6" stroke-width="2.5"/>
    <text x="88" y="272" class="label">Invoice queue</text><text x="88" y="296" class="small">PO + invoice + receipt</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="355" y="165" width="245" height="170" rx="24" fill="#5d43e6"/>
    <text x="385" y="207" style="font:800 12px Inter,Arial,sans-serif;fill:#dcd5ff;letter-spacing:1.4px">STRANDS AGENT</text>
    <text x="385" y="247" style="font:750 23px Inter,Arial,sans-serif;fill:white">PayablePilot</text>
    <text x="385" y="279" style="font:500 14px Inter,Arial,sans-serif;fill:#edeaff">Chooses and sequences tools</text>
    <text x="385" y="304" style="font:500 14px Inter,Arial,sans-serif;fill:#edeaff">Never owns payment facts</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="165" width="155" height="170" rx="24" fill="#fff" stroke="#dcd8e8"/>
    <text x="736" y="204" class="eyebrow">TOOLS</text><text x="736" y="239" class="tool">list</text><text x="736" y="268" class="tool">inspect</text><text x="736" y="297" class="tool">clear / queue</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="180" width="210" height="145" rx="22" fill="#e3f7f0" stroke="#b9e5d8"/>
    <circle cx="969" cy="222" r="17" fill="#0c8669"/><path d="M961 222l6 6 11-13" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="959" y="270" class="label">Clean packet</text><text x="959" y="295" class="small">Clear for payment</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="360" width="210" height="150" rx="22" fill="#fff0e6" stroke="#ffd1b4"/>
    <circle cx="969" cy="402" r="17" fill="#b44d10"/><text x="969" y="408" text-anchor="middle" style="font:800 18px Inter,Arial,sans-serif;fill:white">!</text>
    <text x="959" y="449" class="label">Verified exception</text><text x="959" y="475" class="small">Queue one decision</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="455" width="260" height="105" rx="22" fill="#fff" stroke="#cfc8f3"/>
    <text x="451" y="493" class="eyebrow">HUMAN BOUNDARY</text><text x="451" y="527" class="label">Approve or override</text>
  </g>
</svg>
